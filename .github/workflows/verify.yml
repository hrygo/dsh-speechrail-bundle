name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from package.json's packageManager field; passing one
      # here as well makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      # The declared range is ^22.19.0 || >=24.0.0, so both branches of it run here;
      # fail-fast stays off so one runtime's failure does not hide the other's result.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # verify:ci checks the frozen snapshot hashes only: the pinned upstream commit's
      # git objects are not in this repository (the local `pnpm verify` also compares
      # them, from the upstream remote this runner does not have).
      # Its registry schema check resolves @deepseek-ai/dsh-tools from the workspace, which a
      # clean runner does not have, and the package must not become a dependency: it pulls
      # @deepseek-ai/dsh-llm into the Typert program and breaks generation. So that run prints
      # "check-tool-schema: SKIPPED" by design; the release machine, where the package is
      # present, runs the real check and reports the version it checked.
      - name: Verify baseline, generate, typecheck, build, test
        run: pnpm verify:ci
      # The real registry check, on a runner that has no harness. Without --optional it fails
      # loudly when the install or the path is wrong, so a silent skip cannot pass for a check.
      # The version matches what the other @deepseek-ai devDependencies pin.
      - name: Check the tool schema against @deepseek-ai/dsh-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-tools" --no-save --ignore-scripts @deepseek-ai/dsh-tools@0.2.1-rc.3
          node tools/check-tool-schema.mjs "$RUNNER_TEMP/dsh-tools/node_modules/@deepseek-ai/dsh-tools"
