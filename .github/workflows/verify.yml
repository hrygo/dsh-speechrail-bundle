name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from package.json's packageManager field; passing one
      # here as well makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      # The declared range is ^22.19.0 || >=24.0.0, so both branches of it run here;
      # fail-fast stays off so one runtime's failure does not hide the other's result.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # verify:ci checks the frozen snapshot hashes only: the pinned upstream commit's
      # git objects are not in this repository (the local `pnpm verify` also compares
      # them, from the upstream remote this runner does not have).
      # Its registry schema check resolves @deepseek-ai/dsh-tools from the workspace, which a
      # clean runner does not have, and the package must not become a dependency: it pulls
      # @deepseek-ai/dsh-llm into the Typert program and breaks generation. So it prints
      # "check-tool-schema: SKIPPED" here by design; the release machine, where the package is
      # present, runs the real check and reports the version it checked.
      - name: Verify baseline, generate, typecheck, build, test
        run: pnpm verify:ci
